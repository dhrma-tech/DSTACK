name: plan-eng-review
description: Engineering and architecture review of the plan.
triggerPhrases: ["engineering review", "tech review"]
model: gemini-2.5-pro-preview
streaming: true
requiresArtifacts: ["autoplan", "plan-ceo-review"]
allowedTools: ["read_file", "list_files", "git_status", "search_files"]
inputs: []
outputSchema:
  type: object
  required: ["overallVerdict", "taskReviews", "architectureConcerns", "missingInfrastructure", "securityFlags", "testingGaps", "mustFixBeforeProceeding"]
  properties:
    overallVerdict: { type: string, enum: ["PASS", "REVISE", "FAIL"] }
    taskReviews: { type: array }
    architectureConcerns: { type: array, items: { type: string } }
    missingInfrastructure: { type: array, items: { type: string } }
    securityFlags: { type: array, items: { type: string } }
    testingGaps: { type: array, items: { type: string } }
    mustFixBeforeProceeding: { type: array, items: { type: string } }
artifactPath: plan-eng-review
nextSkill: design-consultation
failureCases: ["CEO review failed"]
acceptanceCriteria: ["Tasks, security, testing, architecture assessed"]
systemPromptFile: prompt.md
