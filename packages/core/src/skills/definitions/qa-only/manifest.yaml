name: qa-only
description: Lightweight test-only QA.
triggerPhrases: ["run tests", "quick qa"]
model: gemini-2.0-flash-001
streaming: true
requiresArtifacts: []
allowedTools: ["run_command", "read_file"]
inputs: []
outputSchema:
  type: object
  required: ["testCommand", "passed", "failed", "skipped", "failures", "overallVerdict"]
  properties:
    testCommand: { type: string }
    passed: { type: number }
    failed: { type: number }
    skipped: { type: number }
    failures: { type: array }
    overallVerdict: { type: string, enum: ["PASS", "FAIL"] }
artifactPath: qa-only
nextSkill: review
failureCases: ["No test runner found"]
acceptanceCriteria: ["Failures accurate", "No false PASS"]
systemPromptFile: prompt.md
