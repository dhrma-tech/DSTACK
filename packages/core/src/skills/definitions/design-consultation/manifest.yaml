name: design-consultation
description: Generate UX design direction and component inventory.
triggerPhrases: ["design this", "ux design"]
model: gemini-2.5-pro-preview
streaming: true
requiresArtifacts: ["autoplan", "plan-eng-review"]
allowedTools: ["read_file", "list_files", "search_files"]
inputs: []
outputSchema:
  type: object
  required: ["screens", "userFlows", "designPrinciples", "responsiveStrategy", "openDesignDecisions"]
  properties:
    screens: { type: array }
    userFlows: { type: array }
    designPrinciples: { type: array, items: { type: string } }
    responsiveStrategy: { type: string }
    openDesignDecisions: { type: array, items: { type: string } }
artifactPath: design-consultation
nextSkill: design-review
failureCases: ["Tech stack unknown"]
acceptanceCriteria: ["Screens, flows, accessibility, responsive strategy present"]
systemPromptFile: prompt.md
