name: plan-tune
description: Revise autoplan surgically based on accumulated review feedback.
triggerPhrases: ["tune plan", "revise plan", "apply review feedback"]
model: gemini-2.5-pro-preview
streaming: true
requiresArtifacts: ["autoplan"]
allowedTools: ["read_file"]
inputs: []
outputSchema:
  type: object
  required: ["baseArtifactTimestamp", "reviewsConsidered", "issuesAddressed", "issuesDeferred", "changeLog", "revisedPlan"]
  properties:
    baseArtifactTimestamp: { type: string }
    reviewsConsidered: { type: array }
    issuesAddressed: { type: array }
    issuesDeferred: { type: array }
    changeLog: { type: array }
    revisedPlan: { type: object }
artifactPath: plan-tune
nextSkill: plan-ceo-review
failureCases: ["autoplan missing", "No review artifacts with issues"]
acceptanceCriteria: ["Change log is diff-friendly", "Revised plan retains autoplan schema"]
systemPromptFile: prompt.md
