name: design-review
description: UX and accessibility critique of the Design Brief.
triggerPhrases: ["review design", "design critique"]
model: gemini-2.5-pro-preview
streaming: true
requiresArtifacts: ["design-consultation"]
allowedTools: ["read_file", "browser_snapshot"]
inputs: []
outputSchema:
  type: object
  required: ["overallVerdict", "screenReviews", "uxAntiPatterns", "accessibilityFailures", "mustFixBeforeProceeding"]
  properties:
    overallVerdict: { type: string, enum: ["PASS", "REVISE", "FAIL"] }
    screenReviews: { type: array }
    uxAntiPatterns: { type: array, items: { type: string } }
    accessibilityFailures: { type: array, items: { type: string } }
    mustFixBeforeProceeding: { type: array, items: { type: string } }
artifactPath: design-review
nextSkill: review
failureCases: ["Missing screens"]
acceptanceCriteria: ["Every screen reviewed", "Accessibility failures surfaced"]
systemPromptFile: prompt.md
