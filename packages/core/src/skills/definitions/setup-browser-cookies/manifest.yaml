name: setup-browser-cookies
description: Import cookies into a named browser session without exposing cookie values.
triggerPhrases: ["setup browser cookies", "import cookies", "authenticate browser"]
model: gemini-2.0-flash-001
streaming: true
requiresArtifacts: []
allowedTools: ["browser_open", "browser_snapshot", "browser_screenshot"]
inputs:
  - { name: session, type: string, required: false, description: Session name }
  - { name: url, type: string, required: true, description: URL }
outputSchema:
  type: object
  required: ["sessionName", "targetUrl", "cookieCount", "sessionFilePath", "authenticationVerified", "authIndicatorsFound", "expiresAt", "warnings"]
  properties:
    sessionName: { type: string }
    targetUrl: { type: string }
    cookieCount: { type: number }
    sessionFilePath: { type: string }
    authenticationVerified: { type: boolean }
    authIndicatorsFound: { type: array }
    warnings: { type: array }
artifactPath: setup-browser-cookies
nextSkill: scrape
failureCases: ["Session write fails"]
acceptanceCriteria: ["Cookie values never in artifact", "Session can be loaded"]
systemPromptFile: prompt.md
