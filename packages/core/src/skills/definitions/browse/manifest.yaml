name: browse
description: Open a URL in managed browser and summarize snapshot, screenshot, and logs.
triggerPhrases: ["browse", "open URL"]
model: gemini-2.0-flash-001
streaming: true
requiresArtifacts: []
allowedTools: ["browser_open", "browser_snapshot", "browser_screenshot", "browser_get_logs", "browser_click", "browser_type"]
inputs: [{ name: url, type: string, required: true, description: URL to inspect }]
outputSchema:
  type: object
  required: ["url", "title", "summary", "consoleErrors", "networkErrors", "accessibilityIssues", "interactiveElements", "screenshotPath", "recommendations"]
  properties:
    url: { type: string }
    title: { type: string }
    summary: { type: string }
    consoleErrors: { type: array, items: { type: string } }
    networkErrors: { type: array, items: { type: string } }
    accessibilityIssues: { type: array, items: { type: string } }
    interactiveElements: { type: array, items: { type: string } }
    screenshotPath: { type: string }
    recommendations: { type: array, items: { type: string } }
artifactPath: browse
nextSkill: qa
failureCases: ["URL unreachable"]
acceptanceCriteria: ["Screenshot saved", "Console errors surfaced"]
systemPromptFile: prompt.md
